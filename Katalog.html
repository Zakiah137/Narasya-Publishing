            gap: 20px;
            padding: 20px;
            margin-top: 0;

            top: 0;
            left: 0;

        .nav {

            font-family: sans-serif;
            font-weight: bold;
            font-size: 14px;
        }

        nav a:hover {
            color: #ffffff;
        }

        .logo-svg {
            height: 40px;
            width: auto;
            display: flex;
            align-items: center;
        }

        .logo-svg svg {
            height: 100%;
            width: auto;
        }

        .logo-svg svg path {
            fill: #dddddd;
            transition: fill 0.3s ease;
        }

        .nav > a:first-child:hover .logo-svg svg path {
            fill: #ffffff;
        }

        body {
            padding-top: 80px;
            margin: 0;
            margin-bottom: 0;
            margin-right: 0;
            margin-left: 0;
            background-image: url('BACKGROUND.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #dddddd;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

    <div id="upload" style="text-align: left; margin-bottom: 30px; margin-left: 20px;"></div>

    <script>
        let buku = JSON.parse(localStorage.getItem('book')) || []
        const isAdmin = localStorage.getItem('isAdmin') === 'true';

                if (isAdmin) {
            document.getElementById('upload').innerHTML = `
            <a href="Up Book.html" style="background: #131313; color: #dddddd; padding: 10px 20px; text-decoration: none; border-radius: 6px; font-family: arial; display: inline-book;">Upload</a>
            `;
        }

        const eventContainer = document.getElementById('terbit');
        eventContainer.innerHTML = '';
        buku.forEach(function(terbit, index) {
            eventContainer.innerHTML += `
            <div class="card-event" onclick="detail(${index})" style="cursor: pointer;">
                <img src="${terbit.cover}">
                <h3>${terbit.judul}</h3>
                <a href="${terbit.link}" target="_blank" style="background: #bddeff ; color: #131313; font-family: arial; font-weight: bold; padding: 6px 12px; text-decoration: none; border-radius: 4px; display: inline-block; margin-top: 5px">${terbit.teks}</a>

                ${isAdmin ? `
                <div style="margin-top: 10px;" onclick="event.stopPropagation()">
                <button onclick="edit(${index})">edit</button>
                <button onclick="hapus(${index})">hapus</button>
                </div>
                ` : ''}
            </div> `
        });

        function detail(index) {
            window.location.href = `Detail.html?id=${index}`;
        }


        function edit(index) {
            let cover = prompt("Edit cover", buku[index].cover);
            let judul = prompt("Edit judul:", buku[index].judul);
            let teks = prompt("Edit teks", buku[index].teks);
            let link = prompt("Edit link", buku[index].link);

            if (cover !== null && judul !== null && teks !== null && link !== null) {
                buku[index] = {judul: judul, cover: cover, teks: teks, link: link};
                localStorage.setItem('book', JSON.stringify(buku));
                window.location.reload();
            }
        }

        function hapus(index) {
            if (confirm("Hapus")) {
                buku.splice(index, 1);
                localStorage.setItem('book', JSON.stringify(buku));
                window.location.reload();
            }
        }
    </script>
