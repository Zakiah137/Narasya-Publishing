    <title>Detail</title>
    
    <meta charset="UTF-8">
    <style>
        
        #detail {
            display: flex;
            gap: 40px;
            align-items: flex-start;
            background-color: rgba(19,19,19,0.6);
            padding: 40px;
            border-radius: 12px;
            width: 900px;
            margin-top: 30px;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .detail-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .detail-info h1 {
            margin: 0 0 10px 0;
        }

        .detail-info p {
            margin: 4px 0;
        }

        .detail-info p::-webkit-scrollbar {
            width: 6px;
        }

        .detail-info p::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .detail-info p::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 10px;
        }
        
        .detail-info p::-webkit-scrollbar-track:hover {
            background: rgba(255, 255, 255, 0.7);
        }
        
        header {
            background-color: #131313;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            box-sizing: border-box;
            z-index: 1000;
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav a {
            color: #dddddd;
            text-decoration: none;
            margin-left: 20px;
            font-family: sans-serif;
            font-weight: bold;
            font-size: 14px;
        }

        nav a:hover {
            color: #ffffff;
        }

        .logo-svg {
            height: 40px;
            width: auto;
            display: flex;
            align-items: center;
        }

        .logo-svg svg {
            height: 100%;
            width: auto;
        }

        .logo-svg svg path {
            fill: #dddddd;
            transition: fill 0.3s ease;
        }

        .nav > a:first-child:hover .logo-svg svg path {
            fill: #ffffff;
        }

        body {
            padding-top: 80px;
            margin: 0;
            margin-bottom: 0;
            margin-right: 0;
            margin-left: 0;
            background-image: url('BACKGROUND.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #dddddd;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>

    <div style="max-width: 900px; width: 100%; margin: 0 auto 40px auto; margin-left: 20px; margin-bottom: 40px;">
    <a href="Katalog.html" style="position: fixed; bottom: 20px; left: 30px; background-color: #131313; color: #dddddd; padding: 5px 10px; border-radius: 6px; text-decoration: none; font-family: arial; font-size: 20px; display: inline-block; max-width: 200px;">Kembali</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const indexBuku = urlParams.get('id');

        let buku = JSON.parse(localStorage.getItem('book')) || [];
        let detailBuku = buku [indexBuku];

        const container = document.getElementById('detail');
        if (detailBuku) {
            container.innerHTML = `
            <img src="${detailBuku.cover}" style="width: 220px; height: 320px; object-fit: cover; border-radius: 8px;"><br><br>

            <div class="detail-info"> 
            <h1>${detailBuku.judul}</h1>
            <p><strong>Penulis: </strong> ${detailBuku.penulis || '-'}</p>
            <p><strong>Tahun Terbit: </strong> ${detailBuku.tahunTerbit || '-'}</p>
            <p><strong>ISBN: </strong> ${detailBuku.isbn || '-'}</p>
            <h3 style="margin: 10px 0 4px 0;">Sinopisis: </h3>
            <p style="max-height: 200px; overflow-y: auto; padding-right: 5px; line-height: 1.5; max-width: 600px;">${detailBuku.sinopsis || 'Belum ada sinopsis.'}</p>
            <a href="${detailBuku.link}" target="_blank">${detailBuku.teks}</a>
            </div>
            `;
        }
    </script>
